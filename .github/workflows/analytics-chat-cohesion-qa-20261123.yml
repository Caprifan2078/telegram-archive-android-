name: QA visual coherence — 23 November 2026
on:
  push:
    branches: [qa/analytics-chat-cohesion-audit-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-visual-walkthrough:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build installable QA and screenshot instrumentation
        run: gradle --no-daemon --max-workers=2 assembleHistoryRoundQa assembleHistoryRoundQaAndroidTest -PqaHistoryRoundInstrumentation=true
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tap screens and capture eleven real Android 11 screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            set +e
            gradle --no-daemon --max-workers=2 connectedHistoryRoundQaAndroidTest -PqaHistoryRoundInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.QaVisualAuditScreenshotsTest'
            outcome=$?
            mkdir -p ui-captures/before
            adb shell ls -al /sdcard/Pictures/TelegramViewerVisualAudit || true
            adb pull /sdcard/Pictures/TelegramViewerVisualAudit/. ui-captures/before/ || true
            exit "$outcome"
      - name: Print selected PNG captures for visual code review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,pathlib
          folder=pathlib.Path("ui-captures/before")
          for name in ("05-chat","11-analytics"):
              p=folder/(name+".png")
              if not p.exists():
                  print("UI_CAPTURE_MISSING "+str(p));continue
              encoded=base64.b64encode(p.read_bytes()).decode("ascii")
              print("UI_CAPTURE_START "+name+" bytes="+str(p.stat().st_size))
              for pos in range(0,len(encoded),12000):print(encoded[pos:pos+12000])
              print("UI_CAPTURE_END "+name)
          PY
      - name: Upload original synthetic walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Visual-Walkthrough-20261123
          retention-days: 7
          if-no-files-found: warn
          path: ui-captures/
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Visual-Walkthrough-Test-Reports
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
