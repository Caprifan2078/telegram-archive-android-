name: Android core-media instrumentation
# Focus: decoder seek, media, synthetic import, reply links, basic navigation, readable UI.
# Includes screenshot and header assertions for the relationship workspace.
on:
  push:
    branches:
      - qa/v052-duplicate-id-safety-20261026
    paths:
      - '.github/workflows/android-core-media-instrumentation.yml'
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/PinnedFocusNavigationRegressionTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-media-instrumentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-device:
    # Guard against billable private repository runners.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and build instrumentation packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.MediaAssetsRegressionTest,org.openarchive.telegram.MediaPlaybackTest,org.openarchive.telegram.RoundPlayerActivityTest,org.openarchive.telegram.PlaybackLifecycleTest,org.openarchive.telegram.ImportRollbackRegressionTest,org.openarchive.telegram.MissingMediaPlaybackRegressionTest,org.openarchive.telegram.ArchiveIntegrationTest,org.openarchive.telegram.TelegramReplyIntegrationTest,org.openarchive.telegram.MediaClassifierTest,org.openarchive.telegram.MediaTabsIsolationTest,org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.ReadableUiTest,org.openarchive.telegram.ExportMediaFilenameRegressionTest,org.openarchive.telegram.PinnedFocusNavigationRegressionTest,org.openarchive.telegram.RelationshipAnalyticsExplanationUiTest'
            # Synthetic-only screenshots created by our fixture-based UI test.
            adb pull /sdcard/Download/ta_synthetic_relationships.png qa-output/relationships-explained.png
            test -s qa-output/relationships-explained.png
            adb pull /sdcard/Download/ta_synthetic_analytics.png qa-output/analytics.png
            test -s qa-output/analytics.png
            adb logcat -d -t 400 > qa-output/emulator-log.txt || true
      - name: Save synthetic instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-media-instrumentation
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
