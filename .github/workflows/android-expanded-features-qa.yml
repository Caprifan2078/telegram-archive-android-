name: Android expanded features and migrations QA
# Include R8-shrunk Lottie API contract regression in the device suite.
on:
  push:
    branches:
      - qa/v052-duplicate-id-safety-20261026
    paths:
      - '.github/workflows/android-expanded-features-qa.yml'
      - 'app/src/main/java/org/openarchive/telegram/MessageDb.java'
      - 'app/src/main/java/org/openarchive/telegram/ChatAnalytics.java'
      - 'app/src/main/java/org/openarchive/telegram/ChatTrends.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/AnalyticsIntegrationTest.java'
      - 'app/src/main/java/org/openarchive/telegram/ArchiveFileImport.java'
      - 'app/src/main/java/org/openarchive/telegram/ArchiveBackup.java'
      - 'app/src/main/java/org/openarchive/telegram/FullBackup.java'
      - 'app/src/main/java/org/openarchive/telegram/RestoreJournal.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/PortableRestoreRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/RestoreRecoveryTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: advanced-features-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-advanced-device:
    # Do not incur private-repository runner charges.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build advanced Android tests
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.AnalyticsIntegrationTest,org.openarchive.telegram.RelationshipsMigrationTest,org.openarchive.telegram.TrendsIntegrationTest,org.openarchive.telegram.TgsRenderingIntegrationTest,org.openarchive.telegram.CollectionsDatabaseTest,org.openarchive.telegram.ConversationPeriodsMigrationTest,org.openarchive.telegram.LocalProfileMigrationTest,org.openarchive.telegram.CustomizationGroupTest,org.openarchive.telegram.MediaUpgradeRegressionTest,org.openarchive.telegram.PerformanceRegressionTest,org.openarchive.telegram.RestoreRecoveryTest,org.openarchive.telegram.PortableRestoreRegressionTest,org.openarchive.telegram.SchemaCollisionMigrationTest,org.openarchive.telegram.QuoteSavedStoreIntegrationTest'
            adb logcat -d -t 400 > qa-output/emulator-log.txt || true
      - name: Save synthetic expanded test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-expanded-feature-tests
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
