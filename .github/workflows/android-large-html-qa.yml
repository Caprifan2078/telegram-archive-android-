name: Android large HTML import QA
on:
  push:
    branches:
      - qa/v052-duplicate-id-safety-20261026
    paths:
      - '.github/workflows/android-large-html-qa.yml'
      - 'app/src/androidTest/java/org/openarchive/telegram/LargeHtmlImportRegressionTest.java'
      - 'app/src/main/java/org/openarchive/telegram/TelegramHtmlStream.java'
      - 'app/src/main/java/org/openarchive/telegram/TelegramImporter.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-large-html-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-large-import:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android test packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.LargeHtmlImportRegressionTest'
            adb logcat -d -s TG_ARCHIVE_BENCH:I '*:S' > qa-output/import-benchmark.txt
      - name: Save synthetic large-import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-100k-html-import
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
