name: Android 14 compatibility QA
on:
  push:
    branches:
      - qa/v052-duplicate-id-safety-20261026
    paths:
      - '.github/workflows/android-modern-compat-qa.yml'
      - 'app/src/main/java/org/openarchive/telegram/MessageDb.java'
      - 'app/src/main/java/org/openarchive/telegram/AttachmentPreviewActivity.java'
      - 'app/src/main/java/org/openarchive/telegram/ArchiveReadOnly.java'
      - 'app/src/main/java/org/openarchive/telegram/OfficePreviewText.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/RarCompatibilityRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/AttachmentPreviewScreenTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/ArchivePreviewIntegrationTest.java'
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/main/java/org/openarchive/telegram/TelegramImporter.java'
      - 'app/src/main/java/org/openarchive/telegram/ArchiveFileImport.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/SearchLifecycleRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/ImportRollbackRegressionTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-modern-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android14:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android test packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.SearchLifecycleRegressionTest,org.openarchive.telegram.ImportRollbackRegressionTest,org.openarchive.telegram.EncryptedTelegramImportRegressionTest,org.openarchive.telegram.MissingMediaPlaybackRegressionTest,org.openarchive.telegram.TelegramReplyIntegrationTest,org.openarchive.telegram.ArchivePreviewIntegrationTest,org.openarchive.telegram.AttachmentPreviewScreenTest,org.openarchive.telegram.RarCompatibilityRegressionTest'
            adb logcat -d -t 400 > qa-output/emulator-log.txt || true
      - name: Save synthetic compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-14-compatibility-qa
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
