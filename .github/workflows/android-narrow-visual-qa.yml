name: Narrow-screen visual regression QA
on:
  push:
    branches:
      - qa/v052-duplicate-id-safety-20261026
    paths:
      - '.github/workflows/android-narrow-visual-qa.yml'
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/RelationshipAnalyticsExplanationUiTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/PinnedFocusNavigationRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/LightAnalyticsVisualTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-narrow-visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-narrow:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build synthetic UI tests
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb shell wm size 640x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.PinnedFocusNavigationRegressionTest#searchButtonsSubmitAndClearText,org.openarchive.telegram.PinnedFocusNavigationRegressionTest#deepSearchResetClearsFiltersWithoutClearingQuery,org.openarchive.telegram.RelationshipAnalyticsExplanationUiTest#analyticsUsesDpOnceAndCapturesSyntheticScreen,org.openarchive.telegram.LightAnalyticsVisualTest#lightThemeHeatmapRemainsReadable'
            adb pull /sdcard/Download/ta_synthetic_search.png qa-output/search-narrow-large-font.png
            adb pull /sdcard/Download/ta_synthetic_deep_search.png qa-output/deep-search-narrow-large-font.png
            test -s qa-output/deep-search-narrow-large-font.png
            adb pull /sdcard/Download/ta_synthetic_analytics.png qa-output/analytics-narrow-large-font.png
            test -s qa-output/search-narrow-large-font.png
            test -s qa-output/analytics-narrow-large-font.png
            adb pull /sdcard/Download/ta_synthetic_light_analytics.png qa-output/analytics-light-narrow-large-font.png
            test -s qa-output/analytics-light-narrow-large-font.png
      - name: Save synthetic screen captures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrow-large-font-visual-qa
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
