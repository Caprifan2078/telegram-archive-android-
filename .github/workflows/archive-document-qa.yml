name: Universal archive and Office preview QA
on:
  push:
    branches:
      - qa/universal-archive-document-viewer-20261027
    paths:
      - '.github/workflows/archive-document-qa.yml'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'app/proguard-rules.pro'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-document-qa-20261027
  cancel-in-progress: true
jobs:
  synthetic-archive-viewer:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile source and run unit tests
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --max-workers=2 testCompactQaUnitTest assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ArchivePreviewIntegrationTest,org.openarchive.telegram.AttachmentPreviewScreenTest,org.openarchive.telegram.EncryptedTelegramImportRegressionTest'
            mkdir -p qa-output
            adb pull /sdcard/Download/ta_office_preview_synthetic.png qa-output/office-preview-synthetic.png
            test -s qa-output/office-preview-synthetic.png
      - name: Preserve synthetic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-archive-preview-qa
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/reports/tests/
            qa-output/
