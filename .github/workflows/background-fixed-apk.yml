name: Background fixed APK with Android regression and native Gemma gate
on:
  pull_request:
    branches: [qa/deep-manifest-fix-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: background-fixed-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/verified-background-apk-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build combined app and JVM tests
        run: gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true -PqaVerifiedHandoff=true -PqaVersionCode=84
      - name: Verify exact signed test APK
        run: |
          set -euo pipefail
          mkdir -p handoff
          cp app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk handoff/Telegram-Archive-Viewer-background-fixed-QA.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose handoff/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging handoff/*.apk | tee handoff/apk-info.txt
          grep -F "package: name='org.openarchive.telegram.qa.polish20261127'" handoff/apk-info.txt
          grep -F "native-code:" handoff/apk-info.txt | grep -F "arm64-v8a"
          (cd handoff && sha256sum *.apk > SHA256SUMS.txt)
          git rev-parse HEAD > handoff/commit.txt
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Combined Android regression and exact APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedProtectedArchiveQaAndroidTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true -PqaVerifiedHandoff=true -PqaVersionCode=84 -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.FullChatModelScanIntegrationTest,org.openarchive.telegram.ConversationPdfExporterTest,org.openarchive.telegram.MediaVisionInputTest,org.openarchive.telegram.AnalystBackgroundSearchUiTest
            cmp handoff/Telegram-Archive-Viewer-background-fixed-QA.apk app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
            adb install -r handoff/Telegram-Archive-Viewer-background-fixed-QA.apk
            adb shell am start -W -n org.openarchive.telegram.qa.polish20261127/org.openarchive.telegram.MainActivity | tee handoff/launch.txt
            grep -q 'Status: ok' handoff/launch.txt
            adb shell pidof org.openarchive.telegram.qa.polish20261127
            adb exec-out screencap -p > handoff/launch.png
      - run: cd handoff && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: background-fixed-test-apk
          path: handoff/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-fixed-android-test-results
          path: app/build/outputs/androidTest-results/
  publish:
    needs: [build, native]
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/verified-background-apk-20261128'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: background-fixed-test-apk
          path: handoff
      - name: Publish standalone experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd handoff
          sha256sum -c SHA256SUMS.txt
          test "$(cat commit.txt)" = "$HEAD_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/qa/verified-background-apk-20261128" --jq .object.sha)" = "$HEAD_SHA"
          tag="background-fixed-qa-20261128-${HEAD_SHA:0:8}"
          gh release create "$tag" Telegram-Archive-Viewer-background-fixed-QA.apk SHA256SUMS.txt --target "$HEAD_SHA" --prerelease --title "Background fixed Telegram Archive Viewer QA" --notes "QA BUILD, NOT FULLY CERTIFIED. Includes the manifest/service fix from ec48aa3. JVM tests, selected scan/PDF/photo tests, installed manifest, background search return, signed exact APK launch on Android 15 and strict native Gemma full scan must pass before publication. Ten other catalog models remain experimental with known memory, engine or quality defects. Broader viewer suites not certified in this run. Separate QA app ID, debug signed; do not uninstall apps containing archives. Model weights downloaded separately."
  native:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/verified-background-apk-20261128'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [gemmae2baltprobe]
    name: Deep scan / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEEP_ALL_MODELS: 'true'
      EXTENDED_QUALITY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native full archive benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 5120M
          disk-size: 8192M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash .github/scripts/real-model-smoke.sh '${{ matrix.model }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-${{ matrix.model }}-report
          path: |
            app/build/outputs/androidTest-results/
            app/build/ui-audit/
