name: Synthetic backup dry-run QA
on:
  push:
    branches:
      - qa/backup-dryrun-integrity-v2-20261027
      - qa/work-backup-envelope-20261028
    paths:
      - '.github/workflows/backup-dryrun-qa.yml'
      - 'app/src/main/java/org/openarchive/telegram/BackupVerifier.java'
      - 'app/build.gradle'
      - 'app/src/androidTest/java/org/openarchive/telegram/BackupDryRunRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/ArchiveIntegrationTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-dryrun-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dry-run:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build instrumentation
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest assembleWorkQa
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.BackupDryRunRegressionTest,org.openarchive.telegram.ArchiveIntegrationTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-dryrun-api-${{ matrix.api }}
          retention-days: 3
          path: app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 30
        with:
          name: telegram-archive-workqa-apk
          retention-days: 3
          path: app/build/outputs/apk/workQa/*.apk
          if-no-files-found: error
