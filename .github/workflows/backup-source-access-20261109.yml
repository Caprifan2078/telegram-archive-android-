name: QA backup source access regression
on:
  push:
    branches: [qa/backup-unreadable-source-20261109]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/DocumentFolder.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/FullBackupSourceAccessRegressionTest.java'
      - '.github/workflows/backup-source-access-20261109.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-source-access-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backup-source-access:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and run JVM checks
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.FullBackupSourceAccessRegressionTest'
      - name: Save synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-source-access-synthetic-results
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
