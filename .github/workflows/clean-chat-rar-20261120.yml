name: QA 2026-11-20 — single import, encrypted RAR and clean chat
on:
  push:
    branches: [qa/single-import-rar-clean-chat-20261120]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/main/java/org/openarchive/telegram/ArchiveFileImport.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/RarCompatibilityRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/Qa00NavigationCoreTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/QaUiChatNavigationRegressionTest.java'
      - 'app/build.gradle'
      - 'scripts/qa_clean_chat_screens.sh'
      - '.github/workflows/clean-chat-rar-20261120.yml'
  pull_request:
    branches: [qa/single-import-rar-clean-chat-20261120]
    paths:
      - 'app/src/androidTest/java/org/openarchive/telegram/**'
      - 'app/src/main/java/org/openarchive/telegram/**'
      - '.github/workflows/clean-chat-rar-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-regress-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and run JVM tests
        run: |
          gradle --no-daemon --max-workers=2 assembleCleanChatQa assembleCleanChatQaAndroidTest testCleanChatQaUnitTest -PqaCleanChatInstrumentation=true
      - name: Verify signed APK ID, permissions and SHA256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/cleanChatQa/app-cleanChatQa.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest'
          "$tools/aapt" dump badging "$apk" | grep '^package:'
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.cleanchat20261120'"
          if "$tools/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/Telegram_Archive_Viewer_0.51_Clean_Chat_QA_2026-11-20.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install deliver/Telegram_Archive_Viewer_0.51_Clean_Chat_QA_2026-11-20.apk
            gradle --no-daemon --max-workers=2 connectedCleanChatQaAndroidTest -PqaCleanChatInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.Qa00NavigationCoreTest,org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.RarCompatibilityRegressionTest,org.openarchive.telegram.EncryptedTelegramImportRegressionTest,org.openarchive.telegram.QaStandaloneHtmlImportRegressionTest,org.openarchive.telegram.QaTrashRestoreRegressionTest,org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.TgsRenderingIntegrationTest'
            bash scripts/qa_clean_chat_screens.sh
      - name: Upload real screenshots and XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-chat-visual-test-results
          retention-days: 7
          path: |
            visual-audit/*.png
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Upload directly installable QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramArchiveViewer-0.51-CleanChat-QA-2026-11-20
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
