name: QA edge-to-edge drawer and AES ZIP
on:
  push:
    branches: [qa/drawer-aes-zip-20261123]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drawer-zip-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drawer-zip:
    name: drawer-zip-android-${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build safe isolated APK, Android tests and JVM tests
        run: gradle --no-daemon --max-workers=2 assembleDrawerZipQa assembleDrawerZipQaAndroidTest testDrawerZipQaUnitTest -PqaDrawerZipInstrumentation=true
      - name: Check release artifact signature and offline permissions
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/drawerZipQa/app-drawerZipQa.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.drawerzip20261123'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          mkdir -p deliver
          cp "$apk" deliver/TelegramViewer_Drawer_AES_ZIP_20261123.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Preview APK for manual testing (before full UI regression)
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-PREVIEW-Android-${{ matrix.api }}-20261123
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test AES-256 ZIP, full UI and navigation on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            result=0
            gradle --no-daemon --max-workers=2 connectedDrawerZipQaAndroidTest -PqaDrawerZipInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.DrawerAesZipRegressionTest,org.openarchive.telegram.IndependentAesZipRegressionTest,org.openarchive.telegram.EncryptedTelegramImportRegressionTest,org.openarchive.telegram.ArchivePasswordOnDemandRegressionTest,org.openarchive.telegram.ArchivePasswordUiRegressionTest,org.openarchive.telegram.UiMenuTourRegressionTest,org.openarchive.telegram.UiChromeOverlapRegressionTest,org.openarchive.telegram.MediaFastScrollRegressionTest,org.openarchive.telegram.MediaInfiniteGalleryRegressionTest,org.openarchive.telegram.ChronologyHubRegressionTest,org.openarchive.telegram.FloatingRoundReattachRegressionTest,org.openarchive.telegram.ChatVisualConsistencyRegressionTest,org.openarchive.telegram.MultiConversationHomeRegressionTest' || result=$?
            mkdir -p app/build/ui-audit
            adb pull /sdcard/Download/ app/build/ui-audit/ || true
            exit "$result"
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-UI-Reports-Android-${{ matrix.api }}-20261123
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/ui-audit/
      - name: Standalone QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Drawer-AES-ZIP-APK-Android-${{ matrix.api }}-20261123
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
