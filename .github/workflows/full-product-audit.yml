name: Full product audit - all 11 models and viewer suites
on:
  pull_request:
    branches: [qa/verified-background-apk-20261128]
permissions:
  contents: read
concurrency:
  group: viewer-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_model:
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    name: Native model / ${{ matrix.model }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [gemmae2baltprobe, qwen06q4, qwen06, qwen17, qwen3508, qwen352, lfm2526, huihui352, gemma4community, gemma4skillsafe, qwen2515]
    runs-on: ubuntu-latest
    env:
      EXTENDED_QUALITY: 'true'
      DEEP_ALL_MODELS: 'true'
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run all local-model unit regressions (retry transient repository resolution)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true 2>&1 | tee unit.log; then exit 0; fi
            if ! grep -Eq '429|Too Many Requests|Could not (find|resolve) (io[.]grpc|com[.]google|org[.]jetbrains|org[.]ow2[.]asm|com[.]android[.]tools):' unit.log || [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 60))
            # Refresh failed dependency lookups, not test assertions.
            # Keep valid cached artifacts; avoid refreshing all dependencies.
          done
      - name: Assemble exact inference test APK
        run: gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verified weights and Russian native inference on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: ${{ contains(fromJSON('["qwen17","qwen3508","qwen352","lfm2526","huihui352","qwen2515"]'), matrix.model) && '8192M' || '5120M' }}
          disk-size: 12288M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash .github/scripts/real-model-smoke.sh '${{ matrix.model }}'
      - name: Preserve actual inference logs and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-${{ matrix.model }}-report
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/ui-audit/

  factual_attribution:
    name: Android factual attribution regression
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JVM regression and lint
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 testProtectedArchiveQaUnitTest lintProtectedArchiveQa -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true 2>&1 | tee unit.log; then exit 0; fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq '429|Too Many Requests|Could not (find|resolve) (io[.]grpc|com[.]google|org[.]jetbrains|org[.]ow2[.]asm|com[.]android[.]tools):' unit.log; then exit 1; fi
            sleep $((attempt * 60))
          done
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual SQLite attribution on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: gradle --no-daemon --max-workers=2 connectedProtectedArchiveQaAndroidTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ChatQuestionAnalystIntegrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factual-attribution-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/

  analytics_ui:
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [35]
        suite: [analytics]
    name: Android ${{ matrix.api }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Generate independent encrypted fixtures
        run: |
          bash .github/scripts/generate-zip-codec-probe.sh
          bash .github/scripts/generate-external-7zip.sh
      - name: Assemble application and test APK, run JVM tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true 2>&1 | tee build-attempt.log; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq '429|Too Many Requests|Could not (find|resolve) (io[.]grpc|com[.]google|org[.]jetbrains|org[.]ow2[.]asm|com[.]android[.]tools):' build-attempt.log; then
              exit 1
            fi
            sleep "$((attempt * 60))"
          done
          exit 1
      - name: Lint
        if: matrix.suite == 'analytics'
        run: gradle --no-daemon --max-workers=2 lintProtectedArchiveQa -PqaLocalModel=true -PqaProtectedArchiveInstrumentation=true
      - name: Verify APK signature and explicit model-download permission
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='org.openarchive.telegram.qa.analyst20261126'"
          sha256sum "$apk" > apk-before-test.sha256
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android regression suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: ANALYST_QA_PACKAGE=org.openarchive.telegram.qa.analyst20261126 ORG_GRADLE_PROJECT_qaLocalModel=true bash .github/scripts/integrated-viewer-audit.sh ${{ matrix.suite }}
      - name: Verify exact APK after emulator tests
        run: sha256sum -c apk-before-test.sha256
      - name: Save exact tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analyst-tested-api${{ matrix.api }}-${{ matrix.suite }}
          retention-days: 7
          path: |
            app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
            apk-before-test.sha256
      - name: Preserve logs, test reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-audit-api${{ matrix.api }}-${{ matrix.suite }}
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/ui-audit/

  viewer_regressions:
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [35]
        suite: [navigation, media, import, backup, recovery, history_export, archive_deep, media_export, chat_storage, protected, viewer, documents, migrations, reading, ui_legacy, zip_codec_probe, final_password_ui]
        include:
          - api: 30
            suite: navigation
          - api: 30
            suite: import
    name: Android ${{ matrix.api }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Generate independent encrypted fixtures
        run: |
          bash .github/scripts/generate-zip-codec-probe.sh
          bash .github/scripts/generate-external-7zip.sh
      - name: Assemble application and test APK, run JVM tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true 2>&1 | tee build-attempt.log; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq '429|Too Many Requests|Could not (find|resolve) (io[.]grpc|com[.]google|org[.]jetbrains|org[.]ow2[.]asm|com[.]android[.]tools):' build-attempt.log; then
              exit 1
            fi
            sleep "$((attempt * 60))"
          done
          exit 1
      - name: Lint
        if: matrix.suite == 'analytics'
        run: gradle --no-daemon --max-workers=2 lintProtectedArchiveQa -PqaLocalModel=true -PqaProtectedArchiveInstrumentation=true
      - name: Verify APK signature and explicit model-download permission
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='org.openarchive.telegram.qa.analyst20261126'"
          sha256sum "$apk" > apk-before-test.sha256
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android regression suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: ANALYST_QA_PACKAGE=org.openarchive.telegram.qa.analyst20261126 ORG_GRADLE_PROJECT_qaLocalModel=true bash .github/scripts/integrated-viewer-audit.sh ${{ matrix.suite }}
      - name: Verify exact APK after emulator tests
        run: sha256sum -c apk-before-test.sha256
      - name: Save exact tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: analyst-tested-api${{ matrix.api }}-${{ matrix.suite }}
          retention-days: 7
          path: |
            app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
            apk-before-test.sha256
      - name: Preserve logs, test reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-audit-api${{ matrix.api }}-${{ matrix.suite }}
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/ui-audit/

  build:
    needs: [real_model, factual_attribution, analytics_ui, viewer_regressions]
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build combined app and JVM tests
        run: gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true -PqaVerifiedHandoff=true -PqaVersionCode=85
      - name: Verify exact signed test APK
        run: |
          set -euo pipefail
          mkdir -p handoff
          cp app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk handoff/Telegram-Archive-Viewer-full-audit-QA.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose handoff/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging handoff/*.apk | tee handoff/apk-info.txt
          grep -F "package: name='org.openarchive.telegram.qa.polish20261127'" handoff/apk-info.txt
          grep -F "native-code:" handoff/apk-info.txt | grep -F "arm64-v8a"
          (cd handoff && sha256sum *.apk > SHA256SUMS.txt)
          git rev-parse HEAD > handoff/commit.txt
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Combined Android regression and exact APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedProtectedArchiveQaAndroidTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true -PqaVerifiedHandoff=true -PqaVersionCode=85 -Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.FullChatModelScanIntegrationTest,org.openarchive.telegram.ConversationPdfExporterTest,org.openarchive.telegram.MediaVisionInputTest,org.openarchive.telegram.AnalystBackgroundSearchUiTest
            cmp handoff/Telegram-Archive-Viewer-full-audit-QA.apk app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
            adb install -r handoff/Telegram-Archive-Viewer-full-audit-QA.apk
            adb shell am start -W -n org.openarchive.telegram.qa.polish20261127/org.openarchive.telegram.MainActivity | tee handoff/launch.txt
            grep -q 'Status: ok' handoff/launch.txt
            adb shell pidof org.openarchive.telegram.qa.polish20261127
            adb exec-out screencap -p > handoff/launch.png
      - run: cd handoff && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full-audit-test-apk
          path: handoff/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-android-test-results
          path: app/build/outputs/androidTest-results/
  publish:
    needs: build
    if: github.event.repository.private == false && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/full-product-audit-20261128'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-audit-test-apk
          path: handoff
      - name: Publish standalone experimental APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd handoff
          sha256sum -c SHA256SUMS.txt
          test "$(cat commit.txt)" = "$HEAD_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/qa/full-product-audit-20261128" --jq .object.sha)" = "$HEAD_SHA"
          tag="full-audit-qa-20261128-${HEAD_SHA:0:8}"
          gh release create "$tag" Telegram-Archive-Viewer-full-audit-QA.apk SHA256SUMS.txt --target "$HEAD_SHA" --prerelease --title "Full audit Telegram Archive Viewer QA" --notes "All 11 pinned catalog models and selected comprehensive Android 11/15 automated viewer suites, JVM and lint passed on source commit before packaging. Signed exact QA APK smoke passed. No physical-device certification; debug signature, separate QA package; do not uninstall previous apps with archives. Model weights separate."
