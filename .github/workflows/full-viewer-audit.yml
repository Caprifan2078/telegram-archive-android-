name: Full Viewer regression audit
on:
  push:
    branches: [qa/full-viewer-audit-20261126]
  pull_request:
    branches: [qa/protected-video-regression-20261125]
    paths:
      - 'app/**'
      - '.github/workflows/full-viewer-audit.yml'
      - '.github/scripts/full-viewer-audit.sh'
permissions:
  contents: read
concurrency:
  group: full-viewer-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
        suite: [import, navigation, media, protected]
    name: Android ${{ matrix.api }} / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Assemble application and test APK, run JVM tests
        run: gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true
      - name: Verify APK signature and offline manifest
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/protectedArchiveQa/app-protectedArchiveQa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android regression suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash .github/scripts/full-viewer-audit.sh ${{ matrix.suite }}
      - name: Preserve logs, test reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-audit-api${{ matrix.api }}-${{ matrix.suite }}
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/ui-audit/
  lint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Static Android lint
        run: gradle --no-daemon --max-workers=2 lintProtectedArchiveQa -PqaProtectedArchiveInstrumentation=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-full-lint
          path: app/build/reports/lint*
