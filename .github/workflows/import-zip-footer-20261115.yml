name: QA Telegram ZIP import footer integrity
on:
  push:
    branches: [qa/import-zip-footer-20261115]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/ArchiveFileImport.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/ArchiveZipFooterImportRegressionTest.java'
      - '.github/workflows/import-zip-footer-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-import-footer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  zip-import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile app and JVM tests
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ArchiveZipFooterImportRegressionTest'
      - name: Upload emulator test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-zip-footer-regression-xml
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 7
