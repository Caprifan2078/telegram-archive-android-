name: Install exact integrated QA-02 APK
on:
  push:
    branches: [qa/work-integrated-qa02-20261102]
    paths: ['.github/workflows/integrated-qa02-exact-install.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integrated-qa02-workqa-apk
          path: qa-apk
          run-id: 41513186703
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify APK digest
        run: echo 'b3adc340cf359ce95d32ae41aab62fdb48bc094d864b992ab1297b52c3a1b34b  qa-apk/app-workQa.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            adb install -t qa-apk/app-workQa.apk
            adb shell am start -W -n org.openarchive.telegram.qa.workqa20261028/org.openarchive.telegram.MainActivity > qa-output/launch.txt
            grep -q 'Status: ok' qa-output/launch.txt
            adb shell pidof org.openarchive.telegram.qa.workqa20261028 > qa-output/pid.txt
            adb shell uiautomator dump /sdcard/ta_workqa_home.xml
            adb pull /sdcard/ta_workqa_home.xml qa-output/home.xml
            grep -q 'Мои переписки' qa-output/home.xml
            adb shell dumpsys package org.openarchive.telegram.qa.workqa20261028 > qa-output/package.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-qa02-exact-install-evidence
          retention-days: 3
          path: qa-output/
