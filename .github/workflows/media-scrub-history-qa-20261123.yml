name: QA right media scrubber and chronology search 2026-11-23
on:
  push:
    branches: [qa/media-fast-scroll-history-search-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-history:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build standalone preview and instrumentation + JVM tests
        run: gradle --no-daemon --max-workers=2 assembleMediaScrubQa assembleMediaScrubQaAndroidTest testMediaScrubQaUnitTest -PqaMediaScrubInstrumentation=true
      - name: Verify offline package and signed APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/mediaScrubQa/app-mediaScrubQa.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.mediascrub20261123'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/TelegramViewer_MediaScrub_HistorySearch_20261123.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 all media categories, chronology search, UI and media regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            set -e
            gradle --no-daemon --max-workers=2 connectedMediaScrubQaAndroidTest -PqaMediaScrubInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.MediaFastScrollRegressionTest,org.openarchive.telegram.HistoryEventSearchRegressionTest,org.openarchive.telegram.MediaInfiniteGalleryRegressionTest,org.openarchive.telegram.ChronologyHubRegressionTest,org.openarchive.telegram.UiChromeOverlapRegressionTest,org.openarchive.telegram.MultiConversationHomeRegressionTest,org.openarchive.telegram.QaVisualAuditScreenshotsTest'
            mkdir -p ui-captures/review
            adb pull /sdcard/Pictures/TelegramViewerVisualAudit/. ui-captures/review/
            adb shell settings put system font_scale 1.35
            gradle --no-daemon --max-workers=2 connectedMediaScrubQaAndroidTest -PqaMediaScrubInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.MediaFastScrollRegressionTest,org.openarchive.telegram.UiChromeOverlapRegressionTest'
            adb shell settings put system font_scale 1.0
      - name: Synthetic Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-MediaScrub-History-QA-Screenshots-20261123
          retention-days: 7
          path: ui-captures/
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-MediaScrub-History-QA-Reports-20261123
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
      - name: Signed isolated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-MediaScrub-History-APK-20261123
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
