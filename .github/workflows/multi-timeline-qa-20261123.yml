name: QA combined multi-conversation timeline 2026-11-23
on:
  push:
    branches: [qa/multi-conversation-timeline-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-multi-timeline:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build isolated APK, test APK and JVM regressions
        run: gradle --no-daemon --max-workers=2 assembleMultiTimelineQa assembleMultiTimelineQaAndroidTest testMultiTimelineQaUnitTest -PqaMultiTimelineInstrumentation=true
      - name: Verify isolated package identity, permissions, signature
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/multiTimelineQa/app-multiTimelineQa.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.multitimeline20261123'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/TelegramViewer_MultiTimeline_20261123.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 timeline, groups, notes, UI and round playback regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: gradle --no-daemon --max-workers=2 connectedMultiTimelineQaAndroidTest -PqaMultiTimelineInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.GroupTimelineReadOnlyRegressionTest,org.openarchive.telegram.GroupTimelineScreenRegressionTest,org.openarchive.telegram.MultiConversationRegistryRegressionTest,org.openarchive.telegram.MultiConversationHomeRegressionTest,org.openarchive.telegram.ChronologyHubRegressionTest,org.openarchive.telegram.FloatingRoundReattachRegressionTest,org.openarchive.telegram.QaUiChatNavigationRegressionTest'
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-MultiTimeline-Reports-20261123
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
      - name: Verified isolated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-MultiTimeline-APK-20261123
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
