name: QA 2026-11-22 — password-on-demand 7z ZIP RAR and unified drawer
on:
  push:
    branches: [qa/password-on-demand-7z-drawer-20261122]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/ArchiveFileImport.java'
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/main/java/org/openarchive/telegram/MenuOutlineIcon.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/ArchivePasswordOnDemandRegressionTest.java'
      - 'app/build.gradle'
      - 'scripts/qa_password_drawer_screens.sh'
      - '.github/workflows/password-on-demand-20261122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK tooling
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Assemble and run JVM tests
        run: |
          gradle --no-daemon --max-workers=2 assemblePasswordOnDemandQa assemblePasswordOnDemandQaAndroidTest testPasswordOnDemandQaUnitTest -PqaPasswordInstrumentation=true
      - name: Check signed package and offline permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/passwordOnDemandQa/app-passwordOnDemandQa.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest'
          "$tools/aapt" dump badging "$apk" | grep '^package:'
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.password20261122'"
          if "$tools/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/Telegram_Archive_Viewer_0.51_Password_7z_UX_2026-11-22.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 — import and navigation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install deliver/Telegram_Archive_Viewer_0.51_Password_7z_UX_2026-11-22.apk
            gradle --no-daemon --max-workers=2 connectedPasswordOnDemandQaAndroidTest -PqaPasswordInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ArchivePasswordOnDemandRegressionTest,org.openarchive.telegram.SevenZTelegramImportRegressionTest,org.openarchive.telegram.EncryptedTelegramImportRegressionTest,org.openarchive.telegram.RarCompatibilityRegressionTest,org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.Qa00NavigationCoreTest,org.openarchive.telegram.UiSmokeTest'
            bash scripts/qa_password_drawer_screens.sh
      - name: Archive XML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-7z-qa-test-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            visual-audit/*.png
      - name: Upload isolated QA APK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramArchiveViewer-0.51-PasswordOnDemand-2026-11-22
          if-no-files-found: error
          retention-days: 7
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
