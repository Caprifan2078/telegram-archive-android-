name: Public Android QA (Viewer 0.47)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: viewer-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-apk:
    # No paid private-repository runner minutes. Switch to Public first.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and QA-only APK
        run: gradle --no-daemon --stacktrace :app:testCompactQaUnitTest :app:assembleCompactQa
      - name: Upload QA APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: telegram-archive-viewer-047-qa
          path: app/build/outputs/apk/compactQa/*.apk
          if-no-files-found: error
          retention-days: 3
