name: QA-00 narrow display and large text
on:
  push:
    branches: [qa/work-modular-audit-00-18]
    paths: ['app/src/androidTest/java/org/openarchive/telegram/Qa00NavigationCoreTest.java', 'app/src/main/java/org/openarchive/telegram/MainActivity.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa00-narrow-font
  cancel-in-progress: false
jobs:
  narrow-font:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile QA builds and JVM tests
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest assembleWorkQa testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            adb shell wm size 320x640
            adb shell wm density 160
            adb shell settings put system font_scale 1.5
            adb shell wm size > qa-output/display-config.txt
            adb shell wm density >> qa-output/display-config.txt
            adb shell settings get system font_scale >> qa-output/display-config.txt
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.UiMenuTourRegressionTest,org.openarchive.telegram.Qa00NavigationCoreTest,org.openarchive.telegram.UiSmokeTest' || touch qa-output/ui-test-failed.marker
            for shot in drawer-home drawer-group-0 drawer-group-1 drawer-group-2 drawer-group-3 help settings-applied font-choices theme-graphite performance-dialog backup-confirm failure; do adb pull "/sdcard/Download/ta_ui_tour_${shot}.png" "qa-output/${shot}.png" || true; done
            for name in performance failure; do adb pull "/sdcard/Download/ta_ui_tour_${name}.xml" "qa-output/${name}.xml" || true; done
            adb exec-out screencap -p > qa-output/final-synthetic-screen.png || true
            adb logcat -d -t 400 > qa-output/logcat.txt || true
      - name: Reject failing UI tests after collecting evidence
        if: always()
        run: test ! -f qa-output/ui-test-failed.marker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa00-narrow-large-text-synthetic-results
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qa00-narrow-workqa-apk
          retention-days: 3
          path: app/build/outputs/apk/workQa/*.apk
          if-no-files-found: error
