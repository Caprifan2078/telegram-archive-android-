name: QA-00 rotation and background
on:
  push:
    branches: [qa/work-modular-audit-00-18]
    paths: ['.github/workflows/qa00-rotation-qa.yml', 'app/src/androidTest/java/org/openarchive/telegram/Qa00RotationLifecycleTest.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa00-rotation-qa
  cancel-in-progress: false
jobs:
  lifecycle:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile synthetic UI test
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            adb shell wm size 360x720
            adb shell wm density 160
            adb shell settings put system font_scale 1.3
            adb shell wm size > qa-output/display-config.txt
            adb shell wm density >> qa-output/display-config.txt
            adb shell settings get system font_scale >> qa-output/display-config.txt
            if ! gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.Qa00RotationLifecycleTest'; then touch qa-output/failed.marker; fi
            adb pull /sdcard/Download/ta_qa00_landscape.png qa-output/landscape.png || true
            adb logcat -d -t 400 > qa-output/logcat.txt || true
      - name: Require passing rotation test
        if: always()
        run: test ! -f qa-output/failed.marker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa00-rotation-synthetic-results
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
