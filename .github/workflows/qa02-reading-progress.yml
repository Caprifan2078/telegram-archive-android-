name: QA-02 reading position isolation
on:
  push:
    branches:
      - qa/qa02-reading-progress-20261102
      - qa/qa02-reading-progress-fixed-20261102
    paths:
      - '.github/workflows/qa02-reading-progress.yml'
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/Qa02ReadingProgressIsolationTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa02-reading-progress
  cancel-in-progress: true
jobs:
  reading-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated test and QA APK
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest assembleWorkQa testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.Qa02ReadingProgressIsolationTest' || touch qa-output/failure.marker
            adb logcat -d -t 400 > qa-output/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa02-reading-synthetic-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
      - name: Require passing test
        if: always()
        run: test ! -f qa-output/failure.marker
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qa02-validated-workqa-apk
          retention-days: 7
          path: app/build/outputs/apk/workQa/*.apk
          if-no-files-found: error
