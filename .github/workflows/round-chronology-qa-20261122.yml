name: QA 2026-11-22 — round autoreturn and chronology hub
on:
  push:
    branches: [qa/round-autoreturn-chronology-hub-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round-chronology-regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Compile and run JVM tests
        run: gradle --no-daemon --max-workers=2 assembleRoundChronologyQa assembleRoundChronologyQaAndroidTest testRoundChronologyQaUnitTest -PqaRoundChronologyInstrumentation=true
      - name: Verify and copy isolated APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/roundChronologyQa/app-roundChronologyQa.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.roundchron20261122'"
          mkdir -p deliver
          cp "$apk" deliver/Telegram_Archive_Viewer_Round_Chronology_QA_20261122.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 — player, history navigation, gallery and archive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install deliver/Telegram_Archive_Viewer_Round_Chronology_QA_20261122.apk
            gradle --no-daemon --max-workers=2 connectedRoundChronologyQaAndroidTest -PqaRoundChronologyInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.ChronologyHubRegressionTest,org.openarchive.telegram.RoundPlayerActivityTest,org.openarchive.telegram.MediaInfiniteGalleryRegressionTest,org.openarchive.telegram.RealTelegramExportStructureRegressionTest'
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-round-chronology-test-reports
          retention-days: 7
          path: |
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
      - name: Verified QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Round-Chronology-QA-20261122
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
