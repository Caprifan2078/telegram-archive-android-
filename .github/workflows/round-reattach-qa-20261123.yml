name: QA round-video reattach 2026-11-23
on:
  push:
    branches: [qa/round-source-reattach-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-round-reattach:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: JVM regressions and isolated signed APK
        run: gradle --no-daemon --max-workers=2 assembleRoundReattachQa assembleRoundReattachQaAndroidTest testRoundReattachQaUnitTest -PqaRoundReattachInstrumentation=true
      - name: Check package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/roundReattachQa/app-roundReattachQa.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.roundreattach20261123'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/TelegramViewer_Round_Reattach_20261123.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 UI, media, chat and visual captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: gradle --no-daemon --max-workers=2 connectedRoundReattachQaAndroidTest -PqaRoundReattachInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.FloatingRoundReattachRegressionTest,org.openarchive.telegram.QaVisualAuditScreenshotsTest,org.openarchive.telegram.AnalyticsSectionNavigationRegressionTest,org.openarchive.telegram.ChatVisualConsistencyRegressionTest,org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.ChronologyHubRegressionTest,org.openarchive.telegram.MediaInfiniteGalleryRegressionTest' && mkdir -p ui-captures/review && adb pull /sdcard/Pictures/TelegramViewerVisualAudit/. ui-captures/review/
      - name: Upload synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Round-Reattach-Screenshots-20261123
          retention-days: 7
          path: ui-captures/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Round-Reattach-Reports-20261123
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/test-results/
      - name: Verified focused chronology QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramViewer-Round-Reattach-QA-APK-20261123
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
