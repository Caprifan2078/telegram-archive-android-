name: Stable QA signing verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-qa:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARCHIVE_QA_KEYSTORE: /tmp/telegram-archive-qa.jks
      ARCHIVE_QA_STORE_PASSWORD: ${{ secrets.ARCHIVE_QA_STORE_PASSWORD }}
      ARCHIVE_QA_KEY_ALIAS: ${{ secrets.ARCHIVE_QA_KEY_ALIAS }}
      ARCHIVE_QA_KEY_PASSWORD: ${{ secrets.ARCHIVE_QA_KEY_PASSWORD }}
      ARCHIVE_QA_CERT_SHA256: ${{ vars.ARCHIVE_QA_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore protected signing key
        env:
          ARCHIVE_QA_KEYSTORE_BASE64: ${{ secrets.ARCHIVE_QA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_QA_KEYSTORE_BASE64"
          test -n "$ARCHIVE_QA_STORE_PASSWORD"
          test -n "$ARCHIVE_QA_KEY_ALIAS"
          test -n "$ARCHIVE_QA_KEY_PASSWORD"
          [[ "$ARCHIVE_QA_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          umask 077
          printf '%s' "$ARCHIVE_QA_KEYSTORE_BASE64" | base64 --decode > "$ARCHIVE_QA_KEYSTORE"
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build signed APK
        run: gradle testCompactQaUnitTest assembleStableQa --no-daemon --max-workers=2
      - name: Verify expected certificate and package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/stableQa/app-stableQa.apk
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose "$apk"
          actual=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$ARCHIVE_QA_CERT_SHA256" | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-badging.txt
          grep -q "package: name='org.openarchive.telegram.qa.previewstable'" apk-badging.txt
          ! grep -q android.permission.INTERNET apk-badging.txt
          sha256sum "$apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-Archive-signed-QA
          path: |
            app/build/outputs/apk/stableQa/app-stableQa.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: python3 -c 'import os; p=os.environ["ARCHIVE_QA_KEYSTORE"]; os.path.exists(p) and os.unlink(p)'
