name: QA single import and chat navigation 2026-11-18
on:
  push:
    branches: [qa/ui-chat-navigation-20261118]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/QaUiChatNavigationRegressionTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/Qa00NavigationCoreTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/QaStandaloneHtmlImportRegressionTest.java'
      - '.github/workflows/ui-chat-navigation-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile QA APK and run JVM tests
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.QaStandaloneHtmlImportRegressionTest,org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.Qa00NavigationCoreTest'
      - name: Save synthetic UI test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ui-navigation-test-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
