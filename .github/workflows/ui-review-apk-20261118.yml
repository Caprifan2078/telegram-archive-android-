name: QA UI Chat review APK — 2026-11-18
on:
  push:
    branches: [qa/ui-chat-navigation-20261118]
    paths:
      - 'app/build.gradle'
      - '.github/workflows/ui-review-apk-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build isolated APK and test project
        run: |
          gradle --no-daemon --max-workers=2 assembleUiReviewQa assembleUiReviewQaAndroidTest testUiReviewQaUnitTest -PqaUiReviewInstrumentation=true
      - name: Verify identity, signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/uiReviewQa/app-uiReviewQa.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest'
          "$tools/aapt" dump badging "$apk" | grep "^package:"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.uichat20261118'"
          if "$tools/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission"; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/Telegram_Archive_Viewer_0.51_UI_QA_2026-11-18.apk
          cd deliver
          sha256sum Telegram_Archive_Viewer_0.51_UI_QA_2026-11-18.apk > SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation and UI smoke tests on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install deliver/Telegram_Archive_Viewer_0.51_UI_QA_2026-11-18.apk
            gradle --no-daemon --max-workers=2 connectedUiReviewQaAndroidTest -PqaUiReviewInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.QaStandaloneHtmlImportRegressionTest,org.openarchive.telegram.UiSmokeTest'
      - name: Upload installable QA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramArchiveViewer-0.51-UI-QA-2026-11-18
          if-no-files-found: error
          retention-days: 7
          path: |
            deliver/Telegram_Archive_Viewer_0.51_UI_QA_2026-11-18.apk
            deliver/SHA256SUMS.txt
      - name: Save emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ui-review-test-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
