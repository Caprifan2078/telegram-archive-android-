name: Qwen whole-archive native audit
on:
  workflow_dispatch:
  push:
    branches: [qa/full-scan-qwen-audit-20261127]
permissions:
  contents: read
jobs:
  real_model:
    if: github.event.repository.private == false && github.ref == 'refs/heads/qa/full-scan-qwen-audit-20261127'
    name: Native model / ${{ matrix.model }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [qwen06, qwen06q4]
    runs-on: ubuntu-latest
    env:
      EXTENDED_QUALITY: 'true'
      PROBE_REVISION: '6e6d6e68ab2ff9873e01d69d6c3421658fb4c840'
      PROBE_SHA: '0ebc29dcd1533a46a84b0078656ffa7010eaa07282fd2b0b6586556373409fd9'
      PROBE_FILE: 'gemma-4-E2B-it-abliterated.litertlm'
      PROBE_SIZE: '2588147712'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run all local-model unit regressions (retry transient repository resolution)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --max-workers=2 testProtectedArchiveQaUnitTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true 2>&1 | tee unit.log; then exit 0; fi
            if ! grep -Eq '429|Too Many Requests|Could not (find|resolve) (io[.]grpc|com[.]google|org[.]jetbrains|org[.]ow2[.]asm|com[.]android[.]tools):' unit.log || [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 60))
            # Refresh failed dependency lookups, not test assertions.
            # Retry without refreshing the entire cache
          done
      - name: Assemble exact inference test APK
        run: gradle --no-daemon --max-workers=2 assembleProtectedArchiveQa assembleProtectedArchiveQaAndroidTest -PqaProtectedArchiveInstrumentation=true -PqaLocalModel=true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verified weights and Russian native inference on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 5120M
          disk-size: 8192M
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash .github/scripts/real-model-smoke.sh '${{ matrix.model }}'
      - name: Preserve actual inference logs and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-${{ matrix.model }}-report
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/ui-audit/
