name: QA UX - one import and chat navigation
on:
  push:
    branches: [qa/ux-chat-import-20261115]
    paths:
      - 'app/src/main/java/org/openarchive/telegram/MainActivity.java'
      - 'app/src/main/java/org/openarchive/telegram/TelegramImportSource.java'
      - 'app/src/test/java/org/openarchive/telegram/TelegramImportSourceTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/UnifiedImportScreenRegressionTest.java'
      - '.github/workflows/ux-chat-import-20261115.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-ux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ux-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and run all JVM tests
        run: gradle --no-daemon --max-workers=2 assembleHandoffQa assembleHandoffQaAndroidTest testHandoffQaUnitTest -PqaHandoffInstrumentation=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedHandoffQaAndroidTest -PqaHandoffInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.UnifiedImportScreenRegressionTest,org.openarchive.telegram.Qa01ChatListSizeTest,org.openarchive.telegram.Qa01TwoChatsTest,org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.ArchiveEndToEndRegressionTest,org.openarchive.telegram.ArchiveZipFooterImportRegressionTest,org.openarchive.telegram.MultipleChatArchiveRegressionTest,org.openarchive.telegram.ImportRollbackRegressionTest,org.openarchive.telegram.MediaTabsIsolationTest'
      - name: Synthetic XML and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ux-import-android-results
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
