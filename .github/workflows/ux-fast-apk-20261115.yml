name: QA UX rapid smoke and APK
on:
  push:
    branches: [qa/ux-chat-import-20261115]
    paths: ['.github/workflows/ux-fast-apk-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Compile and run all JVM unit tests
        run: gradle --no-daemon --max-workers=2 assembleUxQa assembleUxQaAndroidTest testUxQaUnitTest -PqaUxInstrumentation=true
      - name: Confirm isolated APK manifest and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/uxQa/app-uxQa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.uxpreview20261115'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          mkdir -p qa-ux-apk
          cp "$apk" qa-ux-apk/TelegramArchiveViewer_0.51_QA_UX_20261115.apk
          (cd qa-ux-apk && sha256sum TelegramArchiveViewer_0.51_QA_UX_20261115.apk > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 focused UI and archive regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            gradle --no-daemon --max-workers=2 connectedUxQaAndroidTest -PqaUxInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.UiSmokeTest,org.openarchive.telegram.UnifiedImportScreenRegressionTest,org.openarchive.telegram.ArchiveZipFooterImportRegressionTest'
      - name: Publish QA UX APK if tests pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TelegramArchiveViewer-0.51-UX-smoke-20261115
          if-no-files-found: error
          retention-days: 14
          path: qa-ux-apk/*
      - name: Android XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ux-fast-android-xml
          retention-days: 7
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
