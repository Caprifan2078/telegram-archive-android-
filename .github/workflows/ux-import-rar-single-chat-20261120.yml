name: QA UX import fix — RAR4/RAR5 password + single chat UI
on:
  push:
    branches: [qa/ux-import-rar-single-chat-20261120]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/java/org/openarchive/telegram/**'
      - 'app/src/main/res/**'
      - 'app/src/androidTest/java/org/openarchive/telegram/QaPasswordRarImportTest.java'
      - 'app/src/androidTest/java/org/openarchive/telegram/QaUiChatNavigationRegressionTest.java'
      - '.github/workflows/ux-import-rar-single-chat-20261120.yml'
      - 'scripts/qa_uxfix_screenshot_pull.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and JVM regressions
        run: gradle --no-daemon --max-workers=2 assembleUxFixQa assembleUxFixQaAndroidTest testUxFixQaUnitTest -PqaUxFixInstrumentation=true
      - name: Verify isolated signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/uxFixQa/app-uxFixQa.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" | grep "^package:"
          "$tools/aapt" dump badging "$apk" | grep -q "package: name='org.openarchive.telegram.qa.uxfix20261120'"
          if "$tools/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
            echo 'Network permission unexpectedly present'; exit 1
          fi
          mkdir -p deliver
          cp "$apk" deliver/Telegram_Archive_Viewer_0.51_UX_Fix_QA_2026-11-20.apk
          cd deliver
          sha256sum *.apk > SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            adb install deliver/Telegram_Archive_Viewer_0.51_UX_Fix_QA_2026-11-20.apk
            gradle --no-daemon --max-workers=2 connectedUxFixQaAndroidTest -PqaUxFixInstrumentation=true '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.QaPasswordRarImportTest,org.openarchive.telegram.QaUiChatNavigationRegressionTest,org.openarchive.telegram.QaTrashRestoreRegressionTest,org.openarchive.telegram.QaStandaloneHtmlImportRegressionTest,org.openarchive.telegram.UiSmokeTest'
            bash scripts/qa_uxfix_screenshot_pull.sh
      - name: Save UI captures and Android XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-viewer-uxfix-android11-screens
          retention-days: 7
          path: |
            visual-audit/*.png
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
      - name: Publish QA APK and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Archive-Viewer-0.51-UXFix-QA-2026-11-20
          retention-days: 7
          if-no-files-found: error
          path: |
            deliver/*.apk
            deliver/SHA256SUMS.txt
