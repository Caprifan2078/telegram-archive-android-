name: Voice seek UI Android 8
# PDF export and QA-01 pin-order regression are covered in this combined run.
on:
  push:
    branches: [qa/broad-regression-20261105]
    paths: ['.github/workflows/voice-seek-ui-android8-20261105.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-seek-ui-android8-20261105
  cancel-in-progress: false
jobs:
  android-qa:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build test APKs and run JVM tests
        run: gradle --no-daemon --max-workers=2 assembleCompactQa assembleCompactQaAndroidTest assembleWorkQa testCompactQaUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 420
          script: |
            mkdir -p qa-output
            if ! gradle --no-daemon --max-workers=2 connectedCompactQaAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=org.openarchive.telegram.VoiceSeekUiRegressionTest,org.openarchive.telegram.MediaAssetsRegressionTest,org.openarchive.telegram.MissingMediaPlaybackRegressionTest,org.openarchive.telegram.PlaybackLifecycleTest,org.openarchive.telegram.Qa00MediaLifecycleTest'; then touch qa-output/failed.marker; fi
            adb logcat -d -t 400 > qa-output/logcat.txt || true
      - name: Require passing Android tests
        if: always()
        run: test ! -f qa-output/failed.marker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-qa02-synthetic-results
          retention-days: 3
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            qa-output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-qa02-workqa-apk
          retention-days: 3
          path: app/build/outputs/apk/workQa/*.apk
          if-no-files-found: warn

