plugins { id 'com.android.application' }

android {
    namespace 'org.openarchive.telegram'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openarchive.telegram.qa'
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testProguardFiles 'proguard-test-rules.pro'
        targetSdk 35
        versionCode ((project.findProperty('qaVersionCode') ?: '51').toString().toInteger())
        versionName '0.51'
    }
    // Stable QA signing is opt-in and supplied externally; never commit a keystore.
    signingConfigs {
        stableQa {
            def path = System.getenv('ARCHIVE_QA_KEYSTORE')
            if (path) storeFile file(path)
            storePassword System.getenv('ARCHIVE_QA_STORE_PASSWORD')
            keyAlias System.getenv('ARCHIVE_QA_KEY_ALIAS')
            keyPassword System.getenv('ARCHIVE_QA_KEY_PASSWORD')
        }
    }
    // Build both the proven non-minified QA and a separate side-by-side
    // compact QA package. Never change the original QA application ID.
    buildTypes {
        compactQa {
            initWith debug
            applicationIdSuffix '.preview51'
            versionNameSuffix ''
            matchingFallbacks = ['debug']
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    // Isolated Work QA install; its ephemeral debug certificate is not an update key.
    buildTypes {
        workQa {
            initWith compactQa
            applicationIdSuffix '.workqa20261028'
            signingConfig signingConfigs.debug
        }
    }
    // Separate application ID protects existing preview51 data when its key differs.
    buildTypes {
        stableQa {
            initWith compactQa
            applicationIdSuffix '.previewstable'
            signingConfig signingConfigs.stableQa
        }
    }
    testBuildType (project.findProperty('qaStableInstrumentation') == 'true' ? 'stableQa' : 'compactQa')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.core:core:1.15.0'; implementation 'com.airbnb.android:lottie:6.7.1'; implementation 'org.jsoup:jsoup:1.21.2'; implementation 'com.github.junrar:junrar:8.1.2'; implementation 'org.apache.commons:commons-compress:1.28.0'; implementation 'org.tukaani:xz:1.10'; implementation 'net.lingala.zip4j:zip4j:2.11.6'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:rules:1.6.1'; androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1' }

// Converge Kotlin runtime artifacts when AndroidX FileProvider and legacy media
// dependencies pull different jdk7/jdk8 shim versions.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
}

// Refuse to produce an unsigned or accidentally debug-signed stable QA APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains('stableqa') }) {
        def required = ['ARCHIVE_QA_KEYSTORE', 'ARCHIVE_QA_STORE_PASSWORD', 'ARCHIVE_QA_KEY_ALIAS', 'ARCHIVE_QA_KEY_PASSWORD']
        def missing = required.findAll { !System.getenv(it) }
        if (!missing.isEmpty()) throw new GradleException("Stable QA signing is not configured: " + missing.join(', '))
        if (!file(System.getenv('ARCHIVE_QA_KEYSTORE')).isFile()) throw new GradleException('Stable QA keystore file not found')
    }
}
