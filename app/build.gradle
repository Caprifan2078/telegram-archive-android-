plugins { id 'com.android.application' }

android {
    namespace 'org.openarchive.telegram'
    compileSdk 35
    defaultConfig {
        applicationId 'org.openarchive.telegram.qa'
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testProguardFiles 'proguard-test-rules.pro'
        targetSdk 35
        versionCode ((project.findProperty('qaVersionCode') ?: '51').toString().toInteger())
        versionName '0.51'
    }
    // Stable QA signing is opt-in and supplied externally; never commit a keystore.
    signingConfigs {
        stableQa {
            def path = System.getenv('ARCHIVE_QA_KEYSTORE')
            if (path) storeFile file(path)
            storePassword System.getenv('ARCHIVE_QA_STORE_PASSWORD')
            keyAlias System.getenv('ARCHIVE_QA_KEY_ALIAS')
            keyPassword System.getenv('ARCHIVE_QA_KEY_PASSWORD')
        }
    }
    // Build both the proven non-minified QA and a separate side-by-side
    // compact QA package. Never change the original QA application ID.
    buildTypes {
        compactQa {
            initWith debug
            applicationIdSuffix '.preview51'
            versionNameSuffix ''
            matchingFallbacks = ['debug']
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    // Isolated Work QA install; its ephemeral debug certificate is not an update key.
    buildTypes {
        workQa {
            initWith compactQa
            applicationIdSuffix '.workqa20261028'
            signingConfig signingConfigs.debug
        }
    }
    // Separate application ID protects existing preview51 data when its key differs.
    buildTypes {
        stableQa {
            initWith compactQa
            applicationIdSuffix '.previewstable'
            signingConfig signingConfigs.stableQa
        }
    }
    // Isolated handoff preview: never attempts to replace an installed user APK.
    // Ephemeral CI debug signing is fine only because this is a separate package.
    buildTypes {
        handoffQa {
            initWith compactQa
            applicationIdSuffix '.handoff20261115'
            signingConfig signingConfigs.debug
        }
    }
    // Standalone test-review APK: never replace user-installed Work QA / handoff QA.
    buildTypes {
        uiReviewQa {
            initWith compactQa
            applicationIdSuffix '.uichat20261118'
            signingConfig signingConfigs.debug
        }
    }
    // Fresh app ID avoids signature conflicts with earlier 0.51 QA builds.
    buildTypes {
        uiPolishQa {
            initWith compactQa
            applicationIdSuffix '.uipolish20261118'
            signingConfig signingConfigs.debug
        }
    }
    // UI redesign is a separate QA app: never replace an installed archive under a different signing key.
    buildTypes {
        uiStructureQa {
            initWith compactQa
            applicationIdSuffix '.uistruct20261118'
            signingConfig signingConfigs.debug
        }
    }
    // Fresh side-by-side install ID: avoids any signing or data conflict with old QA.
    buildTypes {
        cleanChatQa {
            initWith compactQa
            applicationIdSuffix '.cleanchat20261120'
            signingConfig signingConfigs.debug
        }
    }
    // Separate test package: debug-signed QA must never overwrite an installed viewer.
    buildTypes {
        passwordOnDemandQa {
            initWith compactQa
            applicationIdSuffix '.password20261122'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        galleryQa {
            initWith compactQa
            applicationIdSuffix '.gallery20261122'
            signingConfig signingConfigs.debug
        }
    }
    // Fresh isolated QA package: CI uses an ephemeral debug signing certificate.
    // Never update/replace the user's previous .gallery20261122 installation.
    buildTypes {
        realExportQa {
            initWith compactQa
            applicationIdSuffix '.realexport20261122'
            signingConfig signingConfigs.debug
        }
    }
    // New app ID: never overwrite gallery/real-export QA archives signed by a different CI key.
    buildTypes {
        roundChronologyQa {
            initWith compactQa
            applicationIdSuffix '.roundchron20261122'
            signingConfig signingConfigs.debug
        }
    }
    // Separate package ID keeps older QA installations intact.
    buildTypes {
        historyRoundQa {
            initWith compactQa
            applicationIdSuffix '.historyround20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Independent visual-review APK, never replacing the history/round QA package.
    buildTypes {
        visualCoherenceQa {
            initWith compactQa
            applicationIdSuffix '.visualcoherence20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Independent density-review test package, safe alongside earlier QA builds.
    buildTypes {
        uiDensityQa {
            initWith compactQa
            applicationIdSuffix '.uidensity20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Standalone QA content-clarity APK; never overwrite another debug-signed installation.
    buildTypes {
        contentClarityQa {
            initWith compactQa
            applicationIdSuffix '.contentclarity20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Independent APK prevents a CI debug key from replacing prior QA installations.
    buildTypes {
        roundReattachQa {
            initWith compactQa
            applicationIdSuffix '.roundreattach20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Separate visual QA package; never overwrite archives installed from another runner.
    buildTypes {
        chronologyDirectQa {
            initWith compactQa
            applicationIdSuffix '.chronodirect20261123'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        // Separate package: test installs cannot overwrite the user's existing archives.
        multiChatQa {
            initWith compactQa
            applicationIdSuffix '.multichat20261123'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        // Standalone QA app: never overwrite data from the previous multi-chat preview.
        multiTimelineQa {
            initWith compactQa
            applicationIdSuffix '.multitimeline20261123'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        // Distinct application ID: never overwrite previous QA imports or notes.
        uiAuditQa {
            initWith compactQa
            applicationIdSuffix '.uiaudit20261123'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        // Isolated media navigation QA: never overwrite an installed archive or notes.
        mediaScrubQa {
            initWith compactQa
            applicationIdSuffix '.mediascrub20261123'
            signingConfig signingConfigs.debug
        }
    }
    // Separate package; the CI debug key must not overwrite prior QA imports.
    buildTypes {
        drawerZipQa {
            initWith compactQa
            applicationIdSuffix '.drawerzip20261123'
            signingConfig signingConfigs.debug
        }
    }
    buildTypes {
        protectedArchiveQa {
            initWith compactQa
            applicationIdSuffix '.premium20261126'
            signingConfig signingConfigs.debug
        }
    }
    testBuildType (project.findProperty('qaProtectedArchiveInstrumentation') == 'true' ? 'protectedArchiveQa' : project.findProperty('qaDrawerZipInstrumentation') == 'true' ? 'drawerZipQa' :
        (project.findProperty('qaMediaScrubInstrumentation') == 'true' ? 'mediaScrubQa' : (project.findProperty('qaChronologyDirectInstrumentation') == 'true' ? 'chronologyDirectQa' : (project.findProperty('qaRoundReattachInstrumentation') == 'true' ? 'roundReattachQa' : (project.findProperty('qaContentClarityInstrumentation') == 'true' ? 'contentClarityQa' : (project.findProperty('qaUiDensityInstrumentation') == 'true' ? 'uiDensityQa' : (project.findProperty('qaVisualCoherenceInstrumentation') == 'true' ? 'visualCoherenceQa' : (project.findProperty('qaHistoryRoundInstrumentation') == 'true' ? 'historyRoundQa' : (project.findProperty('qaRoundChronologyInstrumentation') == 'true' ? 'roundChronologyQa' : (project.findProperty('qaRealExportInstrumentation') == 'true' ? 'realExportQa' : (project.findProperty('qaGalleryInstrumentation') == 'true' ? 'galleryQa' : (project.findProperty('qaPasswordInstrumentation') == 'true' ? 'passwordOnDemandQa' : (project.findProperty('qaCleanChatInstrumentation') == 'true' ? 'cleanChatQa' : (project.findProperty('qaUiStructureInstrumentation') == 'true' ? 'uiStructureQa' : (project.findProperty('qaUiPolishInstrumentation') == 'true' ? 'uiPolishQa' : (project.findProperty('qaUiReviewInstrumentation') == 'true' ? 'uiReviewQa' : (project.findProperty('qaHandoffInstrumentation') == 'true' ? 'handoffQa' : (project.findProperty('qaStableInstrumentation') == 'true' ? 'stableQa' : 'compactQa'))))))))))))))))))
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.recyclerview:recyclerview:1.4.0'; implementation 'androidx.core:core:1.15.0'; implementation 'com.airbnb.android:lottie:6.7.1'; implementation 'org.jsoup:jsoup:1.24.1'; implementation 'com.github.junrar:junrar:8.1.2'; implementation 'org.apache.commons:commons-compress:1.28.0'; implementation 'org.tukaani:xz:1.10'; implementation 'net.lingala.zip4j:zip4j:2.11.6'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:rules:1.6.1'; androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'; androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0' }

// Converge Kotlin runtime artifacts when AndroidX FileProvider and legacy media
// dependencies pull different jdk7/jdk8 shim versions.
configurations.configureEach {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
}

// Refuse to produce an unsigned or accidentally debug-signed stable QA APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains('stableqa') }) {
        def required = ['ARCHIVE_QA_KEYSTORE', 'ARCHIVE_QA_STORE_PASSWORD', 'ARCHIVE_QA_KEY_ALIAS', 'ARCHIVE_QA_KEY_PASSWORD']
        def missing = required.findAll { !System.getenv(it) }
        if (!missing.isEmpty()) throw new GradleException("Stable QA signing is not configured: " + missing.join(', '))
        if (!file(System.getenv('ARCHIVE_QA_KEYSTORE')).isFile()) throw new GradleException('Stable QA keystore file not found')
    }
}

// Explicit experimental opt-in: the normal lightweight Viewer does not carry a native LLM runtime.
if (project.findProperty('qaLocalModel') == 'true') {
    android.sourceSets.main.java.srcDir 'src/localModel/java'
    android.sourceSets.main.manifest.srcFile 'src/localModel/AndroidManifest.xml'
    dependencies { implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.2' }
}
